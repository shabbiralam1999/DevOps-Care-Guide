  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="200" fill="#fff"/>
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="190" y1="100" x2="240" y2="100"/><line x1="410" y1="100" x2="460" y2="100"/>
    <line x1="630" y1="100" x2="680" y2="100"/>
  </g>
  <g stroke="#333" stroke-width="2">
