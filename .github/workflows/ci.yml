name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint Python
        run: |
          pip install flake8
          flake8 app --max-line-length=100
      - name: Lint Bash
        run: |
          sudo apt-get install -y shellcheck
          shellcheck system_health.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (verify no build errors)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-intern-task:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -eu
          docker run -d --name smoke-test -p 8080:8080 devops-intern-task:test
          trap 'docker rm -f smoke-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ -o /tmp/response.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/response.json
          grep -q '"status":"running"' /tmp/response.json
